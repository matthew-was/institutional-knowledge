[pytest]
asyncio_mode = auto
markers =
    integration: Full integration tests requiring Ollama, Docling models or the tesseract binary (local only; skipped by default, run with: pytest -m integration)
    ci_integration: CI integration tests — no external services required
; Plain `pytest` (and CI) skips integration tests; `pytest -m integration` runs them,
; because a -m given on the command line comes after addopts and overrides it.
addopts = -m "not integration"
; addopts = --cov=. --cov-report=html --cov-report=term-missing

